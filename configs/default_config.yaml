# 全流程随机种子，用于保证数据划分和代理模型训练结果可复现。
seed: 2026

# 数据配置均相对于项目根目录解析。
data:
  # 输入 Excel 需要包含 schema.py 中定义的输入字段和连续损伤指标字段。
  xlsx_path: "data/raw/injury_data.xlsx"
  # 样本编号字段会在数据准备阶段统一映射为内部字段 case_id。
  case_id_column: "case_id"
  # 高速工况阈值用于汇总 40 km/h 以上样本的预测降损效果。
  high_speed_threshold: 40.0

# 当前默认按 MAIS 分层采用 train/test = 8:2。
split:
  test_size: 0.20

# 四个基础损伤响应采用目标特异回归器，并按各目标的误差特征配置紧凑集成。
surrogate_model:
  # -1 表示使用可用 CPU 并行训练。
  n_jobs: -1
  # 特征工程封装在代理模型内部；base 表示默认仅使用既有输入字段。
  feature_engineering: "base"
  target_models:
    # Amax 组合径向基支持向量回归、梯度提升和随机森林。
    output_Amax:
      - type: "svr"
        weight: 0.2794969859
        C: 3.0
        gamma: "scale"
        epsilon: 0.05
      - type: "xgboost"
        weight: 0.3790003499
        n_estimators: 500
        max_depth: 6
        learning_rate: 0.0187455674
        min_child_weight: 9.4687432474
        subsample: 0.8031474474
        colsample_bytree: 0.7225023111
        reg_alpha: 0.0022657207
        reg_lambda: 0.8909975043
      - type: "random_forest"
        weight: 0.1707527363
        n_estimators: 800
        min_samples_leaf: 6
        max_features: 0.8521247447
      - type: "random_forest"
        weight: 0.1707499279
        n_estimators: 800
        min_samples_leaf: 6
        max_features: 0.8527314719
    # Dmax 组合常规尺度和对数目标尺度的梯度提升模型。
    output_Dmax:
      - type: "hist_gradient_boosting"
        weight: 0.1523592438
        learning_rate: 0.0395165094
        max_iter: 300
        max_leaf_nodes: 80
        min_samples_leaf: 12
        l2_regularization: 0.0941487902
      - type: "xgboost_log"
        weight: 0.2977780378
        n_estimators: 800
        max_depth: 7
        learning_rate: 0.0144685923
        min_child_weight: 4.9023271864
        subsample: 0.7516079764
        colsample_bytree: 0.9419213052
        reg_alpha: 0.0010217458
        reg_lambda: 4.8398084838
      - type: "xgboost"
        weight: 0.3092537070
        n_estimators: 500
        max_depth: 6
        learning_rate: 0.0278969273
        min_child_weight: 8.0256437456
        subsample: 0.7820972600
        colsample_bytree: 0.8821731116
        reg_alpha: 0.0629337577
        reg_lambda: 0.5131306283
      - type: "xgboost"
        weight: 0.2406090115
        n_estimators: 500
        max_depth: 6
        learning_rate: 0.0269558305
        min_child_weight: 15.1748818066
        subsample: 0.7007174714
        colsample_bytree: 0.9926839396
        reg_alpha: 0.0680196708
        reg_lambda: 0.5984641438
    # HIC 组合常规尺度和对数目标尺度的提升模型，以改善高值区拟合。
    output_HIC:
      - type: "hist_gradient_boosting_log"
        weight: 0.4615284346
        learning_rate: 0.0797482927
        max_iter: 300
        max_leaf_nodes: 79
        min_samples_leaf: 8
        l2_regularization: 5.4479248436
      - type: "xgboost"
        weight: 0.1354842923
        n_estimators: 700
        max_depth: 5
        learning_rate: 0.0248390160
        min_child_weight: 3.9628113899
        subsample: 0.8965929867
        colsample_bytree: 0.9741663106
        reg_alpha: 0.0018106333
        reg_lambda: 1.0474572094
      - type: "hist_gradient_boosting_log"
        weight: 0.0678244736
        learning_rate: 0.0364619008
        max_iter: 500
        max_leaf_nodes: 60
        min_samples_leaf: 20
        l2_regularization: 0.7742368667
      - type: "xgboost"
        weight: 0.3351627994
        n_estimators: 700
        max_depth: 4
        learning_rate: 0.0688841469
        min_child_weight: 15.9280096353
        subsample: 0.8451273322
        colsample_bytree: 0.9067587287
        reg_alpha: 0.1831422080
        reg_lambda: 7.0153392262
    # Nij 组合常规尺度和对数目标尺度的梯度提升模型。
    output_Nij:
      - type: "hist_gradient_boosting_log"
        weight: 0.4023344757
        learning_rate: 0.0333283328
        max_iter: 450
        max_leaf_nodes: 80
        min_samples_leaf: 27
        l2_regularization: 1.0431053467
      - type: "hist_gradient_boosting"
        weight: 0.0897626014
        learning_rate: 0.0339789053
        max_iter: 550
        max_leaf_nodes: 34
        min_samples_leaf: 11
        l2_regularization: 3.5084395770
      - type: "hist_gradient_boosting_log"
        weight: 0.3934683507
        learning_rate: 0.0487367879
        max_iter: 300
        max_leaf_nodes: 49
        min_samples_leaf: 7
        l2_regularization: 0.0621966796
      - type: "hist_gradient_boosting_log"
        weight: 0.1144345723
        learning_rate: 0.0874494232
        max_iter: 300
        max_leaf_nodes: 55
        min_samples_leaf: 6
        l2_regularization: 0.3658754661
  # 幅度受限的目标级线性校准用于调整集成预测的尺度与偏移。
  prediction_calibration:
    output_Amax:
      scale: 1.0554311364
      offset: -1.3166081444
    output_Dmax:
      scale: 1.1060458255
      offset: -1.4119182521
    output_HIC:
      scale: 1.1542433323
      offset: -69.4517209752
    output_Nij:
      scale: 1.0482818226
      offset: -0.0311580532
  # 随机树集合只用于统一估计四个目标的局部预测离散程度，不参与最终点预测。
  uncertainty_model:
    n_estimators: 160
    min_samples_leaf: 2
    max_features: "sqrt"

optimization:
  # 近邻数用于计算候选方案相对训练分布的偏离程度。
  neighbor_k: 5
  # 调试时可设置为较小整数以缩短运行时间；null 表示评估完整数据集。
  max_eval_cases: null
  # 座椅位置候选在原始值附近做粗网格搜索，单位沿用输入数据字段。
  delta_pos_offsets: [-60.0, 0.0, 60.0]
  # 靠背角候选在原始值附近做粗网格搜索，单位沿用输入数据字段。
  recline_angle_offsets: [-0.12, 0.0, 0.12]
  # 总评分越低表示候选方案越优，权重用于平衡降损、严重损伤概率、置信度和动作幅度。
  score_weights:
    mais: 1.0
    p_mais_ge3: 0.5
    uncertainty: 0.2
    ood: 0.2
    action_cost: 0.05

output:
  # 每次运行会在该目录下生成一个独立结果目录。
  root_dir: "outputs"
  # 未指定 run_name 时，输出目录名为 run_prefix 加时间戳。
  run_prefix: "run"
  # 从高速工况中挑选若干典型案例，便于后续人工复核或仿真复验。
  typical_case_count: 10
